name: template-check

# The template is only correct if the projects it generates are correct, so
# nothing here inspects template/ directly -- template/ is *supposed* to be full
# of unresolved placeholders. Every check below runs init into a scratch
# directory first, and then checks what came out.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: template-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # `&` and `$` in a project name used to leave `{{PROJECT_NAME}}` in the
  # output. Every run below carries both, so that bug cannot come back
  # unnoticed.
  CHECK_NAME: 'Check & Service $x'
  CHECK_DESC: 'Generated & checked'

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [go, python, ts, other]
    steps:
      - uses: actions/checkout@v4

      - name: Generate a project from the template
        run: |
          ./scripts/init.sh "$RUNNER_TEMP/out" \
            --name "$CHECK_NAME" --desc "$CHECK_DESC" --lang "${{ matrix.lang }}"

      - name: No placeholder survived
        run: |
          # All-caps {{LIKE_THIS}} is a placeholder. `${{ github.ref }}` is a
          # GitHub Actions expression, and a false positive here would make this
          # check untrustworthy, so the pattern is deliberately narrow.
          if grep -rn '{{[A-Z_]' "$RUNNER_TEMP/out"; then
            echo "::error::unresolved placeholders in the generated project"
            exit 1
          fi

      - name: The expected files exist
        run: |
          cd "$RUNNER_TEMP/out"
          for f in AGENTS.md CLAUDE.md LESSONS.md Makefile .gitattributes \
                   .editorconfig .gitignore docs/code-standards.md \
                   docs/reference.md docs/subsystems/README.md \
                   docs/subsystems/_template.md .github/workflows/verify.yml; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done

      - name: The stack block landed
        run: |
          cd "$RUNNER_TEMP/out"
          # Scoped to the block itself. Grepping the whole Makefile would also
          # match the recipes' own `$(SETUP_CMD)` references, and pass even if
          # the block were empty.
          block=$(sed -n '/^# === STACK ===$/,/^# === END STACK ===$/p' Makefile)
          lines=$(printf '%s\n' "$block" | wc -l)
          # Two adjacent markers is 2 lines; the smallest valid stack is 3.
          [ "$lines" -ge 3 ] || { echo "::error::STACK block is empty"; exit 1; }
          if [ "${{ matrix.lang }}" != "other" ]; then
            printf '%s\n' "$block" | grep -q '_CMD' \
              || { echo "::error::no commands in STACK block"; exit 1; }
            grep -q 'uses: actions/setup' .github/workflows/verify.yml \
              || { echo "::error::no toolchain step in verify.yml"; exit 1; }
          fi
          grep -q '### ' docs/code-standards.md \
            || { echo "::error::no conventions section"; exit 1; }

      - name: Line endings are LF and no file has a BOM
        run: |
          cd "$RUNNER_TEMP/out"
          # A CRLF checkout is what made the project this template was mined
          # from fail its own guard tests, so it is checked rather than assumed.
          if find . -type f -exec grep -lI $'\r' {} + 2>/dev/null | grep -q .; then
            echo "::error::CR found in generated files"
            exit 1
          fi
          # Every text file, not just AGENTS.md: a BOM anywhere is the same bug.
          bad=$(find . -type f -exec sh -c '
            for f do
              [ "$(head -c 3 "$f" | od -An -tx1 | tr -d " \n")" = "efbbbf" ] && echo "$f"
            done' sh {} +)
          if [ -n "$bad" ]; then
            echo "::error::UTF-8 BOM in: $bad"
            exit 1
          fi

      - name: Every relative link resolves
        uses: lycheeverse/lychee-action@v2
        with:
          # Local links only. An external link that fails for someone else's
          # reasons trains people to ignore this check.
          args: --offline --no-progress --include-fragments --root-dir "${{ runner.temp }}/out" './**/*.md'
          workingDirectory: ${{ runner.temp }}/out
          fail: true

  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: --no-conventions leaves the gate but not the prose
        run: |
          ./scripts/init.sh "$RUNNER_TEMP/nc" \
            --name "No Conventions" --lang go --no-conventions
          grep -q 'no-conventions' "$RUNNER_TEMP/nc/docs/code-standards.md" \
            || { echo "::error::placeholder section not written"; exit 1; }
          if grep -q '### Go' "$RUNNER_TEMP/nc/docs/code-standards.md"; then
            echo "::error::Go conventions were written anyway"; exit 1
          fi
          # Scoped to the block: the recipes themselves mention `$(SETUP_CMD)`,
          # so a whole-file grep would pass on an empty block.
          sed -n '/^# === STACK ===$/,/^# === END STACK ===$/p' "$RUNNER_TEMP/nc/Makefile" \
            | grep -q '_CMD' \
            || { echo "::error::the gate was skipped too"; exit 1; }

      - name: An omitted --desc leaves no dangling separator
        run: |
          ./scripts/init.sh "$RUNNER_TEMP/nd" --name "Plain" --lang go
          line=$(grep -n '^- \*\*' "$RUNNER_TEMP/nd/AGENTS.md")
          case "$line" in
            *'—'*) echo "::error::dangling em dash with no description: $line"; exit 1 ;;
          esac
          echo "$line"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck init.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # `-s sh`: the script declares `#!/usr/bin/env sh` and must stay POSIX,
          # because Git Bash on Windows is the primary place it runs.
          shellcheck -s sh scripts/init.sh

      - name: The two scripts produce identical trees
        run: |
          # The previous version of this check grepped one Makefile for the
          # string "go test". That passes for an empty stack block, and for any
          # divergence in Python, TypeScript or other. Compare the trees.
          for lang in go python ts other; do
            ./scripts/init.sh "$RUNNER_TEMP/sh-$lang" \
              --name "$CHECK_NAME" --desc "$CHECK_DESC" --lang "$lang"
            pwsh -NoProfile -File ./scripts/init.ps1 "$RUNNER_TEMP/ps-$lang" \
              --name "$CHECK_NAME" --desc "$CHECK_DESC" --lang "$lang"
            if ! diff -r "$RUNNER_TEMP/sh-$lang" "$RUNNER_TEMP/ps-$lang"; then
              echo "::error::the two scripts disagree for --lang $lang"
              exit 1
            fi
          done

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: init.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/init.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }

      - name: init.ps1 generates a project
        shell: pwsh
        run: |
          ./scripts/init.ps1 "$env:RUNNER_TEMP\out" `
            --name "Check & Service" --desc "Generated & checked" --lang go
          if (Select-String -Path "$env:RUNNER_TEMP\out\*" -Pattern '\{\{[A-Z_]' -Recurse) {
            Write-Error "unresolved placeholders"; exit 1
          }
          if ((Get-Content "$env:RUNNER_TEMP\out\Makefile" -Raw) -notmatch 'go test') {
            Write-Error "stack block missing from the PowerShell output"; exit 1
          }
